<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Yagana POS</title>
  <style>
    :root{
      --bg:#0b1120;--panel:#111827;--panel2:#1f2937;--line:#374151;
      --text:#f9fafb;--muted:#9ca3af;--accent:#f59e0b;--accent2:#fbbf24;
      --ok:#22c55e;--bad:#ef4444
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,system-ui,sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;place-items:center;padding:18px}
    .login-card,.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px}
    .login-card{width:min(430px,100%)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo{width:50px;height:50px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#111827;font-size:28px;font-weight:900}
    h1,h2,h3{margin-top:0}.muted{color:var(--muted)}
    label{display:grid;gap:6px;margin:11px 0}
    input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#0f172a;color:white}
    .primary,.secondary,.danger,.nav-btn{border:0;border-radius:10px;padding:11px 13px}
    .primary{background:var(--accent);color:#111827;font-weight:800}
    .secondary{background:#374151;color:white}.danger{background:var(--bad);color:white}
    #app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}
    .sidebar{background:#0f172a;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
    nav{display:grid;gap:7px}.nav-btn{text-align:left;background:transparent;color:white}.nav-btn:hover,.nav-btn.active{background:var(--panel2);color:var(--accent2)}
    .side-bottom{margin-top:auto;display:grid;gap:10px}
    .topbar{position:sticky;top:0;z-index:5;background:rgba(17,24,39,.96);border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px}
    .topbar h1{font-size:21px;margin:0}.topbar .right{margin-left:auto}
    .content{padding:18px;max-width:1500px;margin:auto}
    .grid{display:grid;gap:15px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:15px}.toolbar label{margin:0;min-width:160px}.grow{flex:1}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#374151;font-size:12px}.badge.ok{background:rgba(34,197,94,.18);color:#86efac}.badge.warn{background:rgba(245,158,11,.18);color:#fde68a}.badge.bad{background:rgba(239,68,68,.18);color:#fca5a5}
    .pos{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.75fr);gap:15px}
    .products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
    .product{background:var(--panel2);color:white;border:1px solid var(--line);border-radius:13px;padding:13px;text-align:left;display:grid;gap:7px}
    .product:disabled{opacity:.45}.price{color:var(--accent2);font-weight:900}
    .cart-line,.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
    .qty{display:flex;align-items:center;gap:7px}.qty button{border:0;border-radius:7px;width:29px;height:29px;background:#374151;color:white}
    .total{display:flex;justify-content:space-between;font-size:23px;font-weight:900;margin-top:14px}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .ticket{background:var(--panel2);border-left:5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:12px}.ticket.ready{border-left-color:var(--ok)}
    .ticket-head{display:flex;justify-content:space-between;gap:10px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line)}th{background:#0f172a}
    .empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:12px}
    .toast{position:fixed;right:16px;bottom:16px;background:#111827;border:1px solid var(--line);border-radius:11px;padding:12px 14px;z-index:100}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;z-index:90}
    .modal{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
    .table-card{cursor:pointer;transition:transform .15s,border-color .15s,background .15s}
    .table-card:hover{transform:translateY(-2px);border-color:var(--accent)}
    .table-card.free{border-color:#166534}
    .table-card.occupied{border-color:#b45309}
    .status-line{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
    .current-order{background:#0f172a;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
    .current-order h3{margin:0 0 9px}
    .current-order .row:last-child{border-bottom:0}
    .order-line{padding:10px 0;border-bottom:1px solid var(--line)}
    .order-line:last-child{border-bottom:0}
    .order-line-main{display:flex;justify-content:space-between;gap:10px}
    .order-line-status{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:7px}
    .item-note{margin-top:5px;color:#fde68a;font-size:13px}
    .cart-item{padding:10px 0;border-bottom:1px solid var(--line)}
    .cart-item:last-child{border-bottom:0}
    .cart-note{display:block;margin:8px 0 0}
    .cart-note input{padding:8px;font-size:13px}
    .check-line{display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#0f172a}
    .check-line input{width:auto;margin-top:3px}
    .check-line .check-content{flex:1}
    .payment-box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#0f172a}
    .payment-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .elapsed{font-size:12px;color:var(--muted)}
    @media(max-width:900px){.pos,.cols2,.cols3{grid-template-columns:1fr}}
    @media(max-width:520px){.payment-grid{grid-template-columns:1fr}}
    @media(max-width:720px){
      #app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.sidebar nav{grid-template-columns:repeat(2,1fr)}
      .content{padding:11px}.topbar{position:static}.products{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
  </style>
</head>
<body>
<section id="loginScreen" class="login">
  <div class="login-card">
    <div class="brand">
      <div class="logo">Y</div>
      <div><h1 style="margin:0">Yagana POS</h1><div class="muted">Caja, Cocina y Barra conectadas</div></div>
    </div>
    <label>Correo<input id="loginEmail" type="email" autocomplete="username" placeholder="caja@yagana.com"></label>
    <label>Contraseña<input id="loginPassword" type="password" autocomplete="current-password"></label>
    <button id="loginBtn" class="primary" style="width:100%">Ingresar</button>
    <p id="loginError" class="muted"></p>
  </div>
</section>

<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">Y</div><div><strong>Yagana</strong><div class="muted">Sistema central</div></div></div>
    <nav id="nav"></nav>
    <div class="side-bottom"><span id="roleBadge" class="badge"></span><button id="logoutBtn" class="secondary">Cerrar sesión</button></div>
  </aside>
  <main>
    <header class="topbar">
      <div><h1 id="pageTitle">Yagana POS</h1><div id="pageSub" class="muted"></div></div>
      <div class="right" style="display:flex;gap:8px;align-items:center">
        <button id="soundBtn" class="secondary hidden" type="button">🔔 Sonido</button>
        <span id="onlineBadge" class="badge ok">● En línea</span>
      </div>
    </header>
    <div id="content" class="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, onSnapshot,
  writeBatch, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB55fdEzyFVMbNC86GnIaymYsBX3Cb6fSw",
  authDomain: "yagana-pos.firebaseapp.com",
  projectId: "yagana-pos",
  storageBucket: "yagana-pos.firebasestorage.app",
  messagingSenderId: "342735543844",
  appId: "1:342735543844:web:c14ec956710f178181c2b1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const money = n => new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:2}).format(Number(n||0));
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

const roleByEmail = email => ({
  "admin@yagana.com":"admin",
  "caja@yagana.com":"caja",
  "cocina@yagana.com":"cocina",
  "barra@yagana.com":"barra"
})[(email||"").toLowerCase()] || "sin-permiso";

let user=null, role="sin-permiso", products=[], orders=[], commands=[], sales=[];
let cart=[], selectedTable="1", currentView="inicio", unsubs=[];
let audioContext=null;
let firstCommandsSnapshot=true;
let soundMuted=false;
let knownCommandStatuses=new Map();

function soundStorageKey(){
  return `yagana_sound_muted_${role}`;
}

function loadSoundPreference(){
  soundMuted=localStorage.getItem(soundStorageKey())==="true";
  updateSoundButton();
}

function updateSoundButton(){
  const btn=$("#soundBtn");
  if(!btn)return;
  const visible=["cocina","barra"].includes(role);
  btn.classList.toggle("hidden",!visible);
  btn.textContent=soundMuted?"🔕 Silenciado":"🔔 Sonido";
  btn.title=soundMuted?"Activar aviso sonoro":"Silenciar avisos";
}

function ensureAudio(){
  if(!audioContext){
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(AudioCtx)audioContext=new AudioCtx();
  }
  if(audioContext&&audioContext.state==="suspended"){
    audioContext.resume().catch(()=>{});
  }
}

function playCommandSound(){
  if(soundMuted||!["cocina","barra"].includes(role))return;
  ensureAudio();
  if(!audioContext)return;

  const start=audioContext.currentTime;
  const master=audioContext.createGain();
  master.gain.setValueAtTime(0.0001,start);
  master.gain.exponentialRampToValueAtTime(0.18,start+0.02);
  master.gain.exponentialRampToValueAtTime(0.0001,start+0.55);
  master.connect(audioContext.destination);

  const tones=[
    {frequency:880,at:0,duration:0.18},
    {frequency:1175,at:0.22,duration:0.22}
  ];

  tones.forEach(t=>{
    const osc=audioContext.createOscillator();
    const gain=audioContext.createGain();
    osc.type="sine";
    osc.frequency.setValueAtTime(t.frequency,start+t.at);
    gain.gain.setValueAtTime(0.0001,start+t.at);
    gain.gain.exponentialRampToValueAtTime(0.7,start+t.at+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,start+t.at+t.duration);
    osc.connect(gain);
    gain.connect(master);
    osc.start(start+t.at);
    osc.stop(start+t.at+t.duration+0.03);
  });
}

function toggleSound(){
  soundMuted=!soundMuted;
  localStorage.setItem(soundStorageKey(),String(soundMuted));
  updateSoundButton();
  if(!soundMuted){
    ensureAudio();
    playCommandSound();
    toast("Aviso sonoro activado");
  }else{
    toast("Aviso sonoro silenciado");
  }
}
window.toggleSound=toggleSound;

function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;
  $("#toastRoot").appendChild(t);setTimeout(()=>t.remove(),2600);
}
function modal(html){$("#modalRoot").innerHTML=`<div class="modal-bg"><div class="modal">${html}</div></div>`}
function closeModal(){$("#modalRoot").innerHTML=""}
window.closeModal=closeModal;

function navForRole(){
  const items=[];
  if(["admin","caja"].includes(role))items.push(["inicio","📊 Inicio"],["caja","🛒 Caja"],["mesas","🪑 Mesas"],["productos","📦 Productos"],["ventas","🧾 Ventas"]);
  if(["admin","cocina"].includes(role))items.push(["cocina","👨‍🍳 Cocina"]);
  if(["admin","barra"].includes(role))items.push(["barra","🍺 Barra"]);
  return items;
}
function renderNav(){
  $("#nav").innerHTML=navForRole().map(([v,t])=>`<button class="nav-btn ${v===currentView?"active":""}" data-v="${v}">${t}</button>`).join("");
  document.querySelectorAll(".nav-btn").forEach(b=>b.onclick=()=>setView(b.dataset.v));
}
function setView(v){currentView=v;renderNav();render()}
window.setView=setView;

function startListeners(){
  unsubs.forEach(f=>f());unsubs=[];
  firstCommandsSnapshot=true;
  knownCommandStatuses=new Map();
  unsubs.push(onSnapshot(collection(db,"products"),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));render()}));
  unsubs.push(onSnapshot(collection(db,"commands"),snap=>{
    const changes=snap.docChanges();
    commands=snap.docs.map(d=>({id:d.id,...d.data()}));

    if(!firstCommandsSnapshot){
      const destination=role==="cocina"?"Cocina":role==="barra"?"Barra":null;

      const incoming=changes.some(change=>{
        if(change.type!=="added"||!destination)return false;
        const data=change.doc.data();
        return data.destination===destination&&data.status==="Pendiente";
      });

      if(incoming){
        playCommandSound();
        toast(`Nueva comanda para ${destination}`);
      }

      if(["admin","caja"].includes(role)){
        const readyChange=changes.find(change=>{
          if(change.type!=="modified")return false;
          const data=change.doc.data();
          return data.status==="Listo"&&knownCommandStatuses.get(change.doc.id)!=="Listo";
        });

        if(readyChange){
          const data=readyChange.doc.data();
          toast(`Mesa ${data.table}: pedido listo en ${data.destination}`);
        }
      }
    }

    knownCommandStatuses=new Map(commands.map(c=>[c.id,c.status]));
    firstCommandsSnapshot=false;
    render();
  }));
  if(["admin","caja"].includes(role)){
    unsubs.push(onSnapshot(collection(db,"orders"),snap=>{orders=snap.docs.map(d=>({id:d.id,...d.data()}));render()}));
    unsubs.push(onSnapshot(collection(db,"sales"),snap=>{sales=snap.docs.map(d=>({id:d.id,...d.data()}));render()}));
  }
}
function render(){
  if(!user)return;
  const map={
    inicio:renderHome,caja:renderCaja,mesas:renderTables,productos:renderProducts,
    ventas:renderSales,cocina:()=>renderStation("Cocina"),barra:()=>renderStation("Barra")
  };
  (map[currentView]||renderHome)();
}
function title(a,b=""){$("#pageTitle").textContent=a;$("#pageSub").textContent=b}

function commandStatusFor(orderId,destination){
  const list=commands.filter(c=>c.orderId===orderId&&c.destination===destination);
  if(!list.length)return "Sin pedido";
  if(list.every(c=>c.status==="Entregado"))return "Entregado";
  if(list.every(c=>["Listo","Entregado"].includes(c.status)))return "Listo";
  if(list.some(c=>c.status==="Preparando"))return "Preparando";
  return "Pendiente";
}

function statusClass(status){
  if(status==="Entregado"||status==="Listo")return "ok";
  if(status==="Pendiente"||status==="Preparando")return "warn";
  if(status==="Cancelada")return "bad";
  return "";
}

function timestampToDate(value){
  if(!value)return null;
  if(typeof value.toDate==="function")return value.toDate();
  if(typeof value.seconds==="number")return new Date(value.seconds*1000);
  const parsed=new Date(value);
  return Number.isNaN(parsed.getTime())?null:parsed;
}

function elapsedText(value){
  const date=timestampToDate(value);
  if(!date)return "recién";
  const minutes=Math.max(0,Math.floor((Date.now()-date.getTime())/60000));
  if(minutes<1)return "hace menos de 1 min";
  if(minutes<60)return `hace ${minutes} min`;
  const hours=Math.floor(minutes/60);
  const rest=minutes%60;
  return rest?`hace ${hours} h ${rest} min`:`hace ${hours} h`;
}

function productCommandStatus(orderId,item){
  const list=commands.filter(c=>
    c.orderId===orderId
    && c.destination===(item.destination||"Cocina")
    && (c.items||[]).some(ci=>ci.productId===item.productId)
    && c.status!=="Cancelada"
  );
  if(!list.length)return "Sin enviar";
  if(list.every(c=>c.status==="Entregado"))return "Entregado";
  if(list.some(c=>c.status==="Pendiente"))return "Pendiente";
  if(list.some(c=>c.status==="Preparando"))return "Preparando";
  if(list.some(c=>c.status==="Listo"))return "Listo";
  return list[0].status||"Sin enviar";
}

function openTableOrder(table){
  selectedTable=String(table);
  cart=[];
  setView("caja");
}
window.openTableOrder=openTableOrder;

function renderHome(){
  title("Inicio","Información compartida en tiempo real");
  const active=commands.filter(c=>!["Entregado","Cancelada"].includes(c.status)).length;
  const open=orders.filter(o=>o.status==="Abierta").length;
  const total=sales.reduce((a,s)=>a+Number(s.total||0),0);
  $("#content").innerHTML=`
  <div class="grid cols3">
    <section class="card"><div class="muted">Comandas activas</div><h2>${active}</h2></section>
    <section class="card"><div class="muted">Mesas abiertas</div><h2>${open}</h2></section>
    <section class="card"><div class="muted">Ventas registradas</div><h2>${money(total)}</h2></section>
  </div>
  <section class="card" style="margin-top:15px">
    <h2>Sistema central conectado</h2>
    <p>Caja, Cocina y Barra están leyendo la misma base de datos.</p>
    ${products.length===0&&["admin","caja"].includes(role)?`<button class="primary" onclick="seedProducts()">Crear productos iniciales</button>`:""}
  </section>`;
}

function renderCaja(){
  title("Caja","Crear pedidos, ver estados y cobrar");
  const cats=["Todas",...new Set(products.map(p=>p.category||"General"))];
  const openOrder=orders.find(o=>o.table===selectedTable&&o.status==="Abierta");
  const cocinaStatus=openOrder?commandStatusFor(openOrder.id,"Cocina"):"Sin pedido";
  const barraStatus=openOrder?commandStatusFor(openOrder.id,"Barra"):"Sin pedido";

  $("#content").innerHTML=`
  <div class="toolbar">
    <label>Mesa<select id="tableSel">${Array.from({length:12},(_,i)=>`<option ${String(i+1)===selectedTable?"selected":""}>${i+1}</option>`).join("")}</select></label>
    <label class="grow">Buscar<input id="searchProd" placeholder="Producto"></label>
    <label>Categoría<select id="catSel">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>
    <button class="secondary" onclick="setView('mesas')">Volver a mesas</button>
  </div>

  <div class="pos">
    <section class="card"><div id="productGrid" class="products"></div></section>

    <section class="card">
      <h2>Mesa ${selectedTable}</h2>

      ${openOrder?`
        <div class="current-order">
          <div class="ticket-head">
            <h3>Cuenta actual</h3>
            <span class="elapsed">${elapsedText(openOrder.createdAt||openOrder.updatedAt)}</span>
          </div>

          ${(openOrder.items||[]).map(i=>{
            const itemStatus=productCommandStatus(openOrder.id,i);
            return `
            <div class="order-line">
              <div class="order-line-main">
                <span><strong>${i.qty} × ${esc(i.name)}</strong></span>
                <strong>${money(i.price*i.qty)}</strong>
              </div>
              ${i.note?`<div class="item-note">📝 ${esc(i.note)}</div>`:""}
              <div class="order-line-status">
                <span>${i.destination==="Barra"?"🍺":"👨‍🍳"} ${esc(i.destination||"Cocina")}</span>
                <span class="badge ${statusClass(itemStatus)}">${itemStatus}</span>
              </div>
            </div>`;
          }).join("")}

          <div class="total"><span>Acumulado</span><span>${money(openOrder.total)}</span></div>
          <div class="status-line"><span>👨‍🍳 Cocina general</span><span class="badge ${statusClass(cocinaStatus)}">${cocinaStatus}</span></div>
          <div class="status-line"><span>🍺 Barra general</span><span class="badge ${statusClass(barraStatus)}">${barraStatus}</span></div>
        </div>`:
        `<div class="current-order"><span class="badge ok">Mesa libre</span><p class="muted">Agregá productos para iniciar el pedido.</p></div>`
      }

      <h3>Productos nuevos</h3>
      <div id="cart"></div>
      <div class="total"><span>Nuevo pedido</span><span id="cartTotal"></span></div>

      <div class="actions">
        <button class="primary" onclick="sendOrder()">Enviar pedido</button>
        <button class="secondary" onclick="clearCart()">Vaciar</button>
        ${openOrder?`<button class="secondary" onclick="checkout('${openOrder.id}')">Cobrar / dividir</button>`:""}
        ${openOrder?`<button class="danger" onclick="cancelOrder('${openOrder.id}')">Anular pedido</button>`:""}
      </div>
    </section>
  </div>`;

  $("#tableSel").onchange=e=>{
    selectedTable=e.target.value;
    cart=[];
    renderCaja();
  };

  const drawProducts=()=>{
    const q=$("#searchProd").value.toLowerCase().trim();
    const cat=$("#catSel").value;
    const list=products.filter(p=>
      p.active!==false
      && (cat==="Todas"||p.category===cat)
      && (!q||(p.name+" "+p.category).toLowerCase().includes(q))
    );

    $("#productGrid").innerHTML=list.length?list.map(p=>`
      <button class="product" onclick="addToCart('${p.id}')" ${Number(p.stock||0)<=0?"disabled":""}>
        <strong>${esc(p.name)}</strong>
        <span class="price">${money(p.price)}</span>
        <span class="muted">${esc(p.destination)} · stock ${p.stock||0}</span>
      </button>`).join(""):`<div class="empty">No hay productos.</div>`;
  };

  $("#searchProd").oninput=drawProducts;

function drawCart(){
  const root=$("#cart");
  if(!root)return;

  root.innerHTML=cart.length?cart.map(i=>`
    <div class="cart-item">
      <div class="cart-line">
        <div>
          <strong>${esc(i.name)}</strong>
          <div class="muted">${money(i.price)}</div>
        </div>
        <div class="qty">
          <button onclick="qty('${i.productId}',-1)">−</button>
          <strong>${i.qty}</strong>
          <button onclick="qty('${i.productId}',1)">+</button>
        </div>
      </div>
      <label class="cart-note">
        Observación para ${esc(i.destination||"Cocina")}
        <input
          value="${esc(i.note||"")}"
          placeholder="Ej.: sin cebolla, sin hielo..."
          onchange="setCartNote('${i.productId}',this.value)">
      </label>
    </div>`).join(""):`<div class="empty">Pedido vacío.</div>`;

  $("#cartTotal").textContent=money(cart.reduce((a,i)=>a+i.price*i.qty,0));
}

window.addToCart=id=>{
  const p=products.find(x=>x.id===id);
  if(!p)return;

  const line=cart.find(x=>x.productId===id);
  if(line){
    if(line.qty>=Number(p.stock||0))return toast("Stock insuficiente");
    line.qty++;
  }else{
    cart.push({
      productId:p.id,
      name:p.name,
      price:Number(p.price||0),
      qty:1,
      destination:p.destination||"Cocina",
      note:""
    });
  }
  drawCart();
};

window.setCartNote=(id,note)=>{
  const line=cart.find(x=>x.productId===id);
  if(line)line.note=String(note||"").trim();
};

window.qty=(id,d)=>{
  const line=cart.find(x=>x.productId===id);
  const p=products.find(x=>x.id===id);
  if(!line)return;

  const next=line.qty+d;
  if(next>Number(p.stock||0))return toast("Stock insuficiente");

  if(next<=0)cart=cart.filter(x=>x.productId!==id);
  else line.qty=next;

  drawCart();
};

window.clearCart=()=>{
  cart=[];
  drawCart();
};
window.sendOrder=async()=>{
  if(!cart.length)return toast("Agregá productos");
  try{
    const open=orders.find(o=>o.table===selectedTable&&o.status==="Abierta");
    let orderId;
    if(open){
      const combined=(open.items||[]).map(i=>({...i}));
      for(const item of cart){
        const found=combined.find(x=>x.productId===item.productId&&(x.note||"")===(item.note||""));
        if(found)found.qty+=item.qty;else combined.push({...item});
      }
      await updateDoc(doc(db,"orders",open.id),{
        items:combined,total:combined.reduce((a,i)=>a+i.price*i.qty,0),updatedAt:serverTimestamp()
      });
      orderId=open.id;
    }else{
      const ref=await addDoc(collection(db,"orders"),{
        table:selectedTable,status:"Abierta",items:cart.map(i=>({...i})),
        total:cart.reduce((a,i)=>a+i.price*i.qty,0),createdAt:serverTimestamp(),createdBy:user.email
      });
      orderId=ref.id;
    }

    const groups={};
    cart.forEach(i=>(groups[i.destination]??=[]).push({...i}));
    const batch=writeBatch(db);
    for(const [destination,items] of Object.entries(groups)){
      const ref=doc(collection(db,"commands"));
      batch.set(ref,{orderId,table:selectedTable,destination,items,status:"Pendiente",createdAt:serverTimestamp(),createdBy:user.email});
    }
    await batch.commit();
    cart=[];toast("Pedido enviado a Cocina y Barra");renderCaja();
  }catch(e){
    console.error(e);toast("No se pudo enviar: "+(e.code||e.message));
  }
};

    const total=(o.items||[])

      .reduce((sum,item)=>sum+Number(item.price)*Number(item.qty),0);

    $("#selectedTotal").textContent=money(total);
    $("#selectedTotal").dataset.value=String(total);

    if($("#paymentMode").value==="combined"){
      const a1=Number($("#amount1").value||0);
      if(!$("#amount1").dataset.touched){
        $("#amount1").value=(total/2).toFixed(2);
        $("#amount2").value=(total-total/2).toFixed(2);
      }
      const current1=Number($("#amount1").value||0);
      const current2=Number($("#amount2").value||0);
      const diff=total-current1-current2;
      $("#paymentDifference").textContent=Math.abs(diff)<0.01
        ?"Importes completos"
        :`Falta completar ${money(diff)}`;
      $("#paymentDifference").className=Math.abs(diff)<0.01?"badge ok":"badge warn";
    }
  };

  document.querySelectorAll(".pay-item").forEach(el=>el.onchange=calculateSelected);

  $("#paymentMode").onchange=()=>{

    $("#amount2").value=Math.max(0,total-amount1).toFixed(2);
    calculateSelected();
  };

  $("#amount2").oninput=()=>{
    $("#amount1").dataset.touched="true";
    calculateSelected();
  };

  $("#confirmPay").onclick=()=>completeSale(o);
  calculateSelected();
};

async function completeSale(o){
  try{
    const selectedIndexes=[...document.querySelectorAll(".pay-item:checked")]
      .map(el=>Number(el.dataset.index));

    if(!selectedIndexes.length)return toast("Seleccioná al menos un producto");

    const selectedItems=(o.items||[])
      .filter((_,index)=>selectedIndexes.includes(index))
      .map(item=>({...item}));

    const remainingItems=(o.items||[])
      .filter((_,index)=>!selectedIndexes.includes(index))
      .map(item=>({...item}));

    const total=selectedItems.reduce(
      (sum,item)=>sum+Number(item.price)*Number(item.qty),0
    );

    let payments=[];
    let paymentText="";

    if($("#paymentMode").value==="single"){
      paymentText=$("#payment").value;
      payments=[{method:paymentText,amount:total}];
    }else{
      const amount1=Number($("#amount1").value||0);
      const amount2=Number($("#amount2").value||0);

      if(amount1<0||amount2<0)return toast("Los importes no pueden ser negativos");
      if(Math.abs(amount1+amount2-total)>0.01){
        return toast("Los dos importes deben sumar el total seleccionado");
      }

      payments=[
        {method:$("#payment1").value,amount:amount1},
        {method:$("#payment2").value,amount:amount2}
      ].filter(p=>p.amount>0);

      paymentText=payments.map(p=>`${p.method}: ${money(p.amount)}`).join(" + ");
    }

    const soldByProduct=new Map();
    for(const item of selectedItems){
      soldByProduct.set(
        item.productId,
        (soldByProduct.get(item.productId)||0)+Number(item.qty)
      );
    }

    for(const [productId,qty] of soldByProduct.entries()){
      const p=products.find(x=>x.id===productId);
      if(!p||Number(p.stock||0)<qty){
        return toast(`Stock insuficiente: ${p?.name||"producto"}`);
      }
    }

    const batch=writeBatch(db);

    if(remainingItems.length){
      batch.update(doc(db,"orders",o.id),{
        items:remainingItems,
        total:remainingItems.reduce((sum,item)=>sum+Number(item.price)*Number(item.qty),0),
        updatedAt:serverTimestamp(),
        lastPaymentAt:serverTimestamp(),
        lastPaymentBy:user.email
      });
    }else{
      batch.update(doc(db,"orders",o.id),{
        status:"Pagada",
        payment:paymentText,
        payments,
        paidAt:serverTimestamp(),
        paidBy:user.email
      });
    }

    const saleRef=doc(collection(db,"sales"));
    batch.set(saleRef,{
      orderId:o.id,
      table:o.table,
      items:selectedItems,
      total,
      payment:paymentText,
      payments,
      partial:remainingItems.length>0,
      createdAt:serverTimestamp(),
      createdBy:user.email
    });

    for(const [productId,qty] of soldByProduct.entries()){
      const p=products.find(x=>x.id===productId);
      batch.update(doc(db,"products",p.id),{
        stock:Number(p.stock||0)-qty
      });
    }

    if(!remainingItems.length){
      for(const c of commands.filter(c=>
        c.orderId===o.id&&!["Entregado","Cancelada"].includes(c.status)
      )){
        batch.update(doc(db,"commands",c.id),{
          status:"Entregado",
          updatedAt:serverTimestamp()
        });
      }
    }

    await batch.commit();
    closeModal();
    toast(remainingItems.length
      ?"Pago parcial registrado; la mesa sigue abierta"
      :"Venta registrada y mesa cerrada"
    );

  }catch(e){
    console.error(e);
    toast("Error al cobrar: "+(e.code||e.message));
  }
}

window.cancelOrder=id=>{
  const o=orders.find(x=>x.id===id);
  if(!o)return;

  modal(`<h2>Anular pedido · Mesa ${esc(o.table)}</h2>
    <p class="muted">El pedido dejará de aparecer como mesa abierta. El motivo quedará guardado.</p>

    </label>

      <button class="secondary" onclick="closeModal()">Volver</button>
      <button class="danger" id="confirmCancel">Confirmar anulación</button>
    </div>`);

  $("#confirmCancel").onclick=async()=>{
    const reason=$("#cancelReason").value.trim();
    if(!reason)return toast("Ingresá el motivo");

    try{
      const batch=writeBatch(db);
      batch.update(doc(db,"orders",o.id),{
        status:"Cancelada",
        cancelReason:reason,
        cancelledAt:serverTimestamp(),
        cancelledBy:user.email
      });

      for(const c of commands.filter(c=>
        c.orderId===o.id&&!["Entregado","Cancelada"].includes(c.status)
      )){
        batch.update(doc(db,"commands",c.id),{
          status:"Cancelada",
          cancelReason:reason,
          updatedAt:serverTimestamp()
        });
      }

      await batch.commit();
      closeModal();
      toast("Pedido anulado");
    }catch(e){
      console.error(e);
      toast("No se pudo anular: "+(e.code||e.message));
    }
  };
};
